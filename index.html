<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selector RGB</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">🎨 Selector de Color RGB</h2>

    <div class="row">
        <!-- Controles -->
        <div class="col-md-6">

            <div class="mb-3">
                <label class="form-label">Rojo (R)</label>
                <input type="range" class="form-range" min="0" max="255" id="red">
                <input type="number" class="form-control mt-1" min="0" max="255" id="redInput" value="0">
            </div>

            <div class="mb-3">
                <label class="form-label">Verde (G)</label>
                <input type="range" class="form-range" min="0" max="255" id="green">
                <input type="number" class="form-control mt-1" min="0" max="255" id="greenInput" value="0">
            </div>

            <div class="mb-3">
                <label class="form-label">Azul (B)</label>
                <input type="range" class="form-range" min="0" max="255" id="blue">
                <input type="number" class="form-control mt-1" min="0" max="255" id="blueInput" value="0">
            </div>

            <h5>Código HEX: <span id="hexCode">#000000</span></h5>
        </div>

        <!-- Vista del color -->
        <div class="col-md-6 d-flex align-items-center justify-content-center">
            <div id="colorBox"></div>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="footer text-center">
    <p>👨‍💻 <strong>Milton Juarez Austria</strong></p>
    <p>🏫 TECNM Campus Pachuca</p>
    <p>📚 Taller de Investigación de Desarrollo de Software</p>
    <p class="emoji-line">🎨🔥💻🚀</p>
</footer>

<!-- JS propio -->
<script src="script.js"></script>
</body>
</html>
